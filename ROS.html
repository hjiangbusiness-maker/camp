<style>
  :root{ --paper:#ffffff; --card:#ffffff; --ink:#1b1714; --muted:#6b6258; --faint:#8a7f73;
    --line:#d9d2c7; --dash:#4a423b; --accent:#ff5232; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--paper); color:var(--ink);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,sans-serif;
    display:grid; place-items:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .card{ width:100%; max-width:360px; background:var(--card); border:1px solid var(--ink); padding:28px 26px 20px; }
  .kicker{ font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
    letter-spacing:.22em; color:var(--accent); text-transform:uppercase; margin-bottom:8px; }
  h1{ font-size:26px; font-weight:900; letter-spacing:-0.02em; margin-bottom:20px; }
  label{ display:block; font-family:'Space Mono',monospace; font-size:9px; font-weight:700;
    letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin-bottom:7px; }
  input{ width:100%; font-size:15px; font-family:'Space Mono',monospace; padding:11px 13px;
    border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:0; }
  input:focus{ outline:none; border-color:var(--accent); }
  button{ width:100%; margin-top:14px; font-size:12px; font-weight:700; padding:12px 13px;
    font-family:'Space Mono',monospace; letter-spacing:.18em; text-transform:uppercase;
    border:none; background:var(--ink); color:var(--paper); cursor:pointer; }
  button:hover{ background:var(--accent); }
  button:disabled{ opacity:.6; cursor:default; }
  .err{ color:var(--accent); font-family:'Space Mono',monospace; font-size:11px; margin-top:12px; min-height:16px; }
  .barcode{ height:24px; margin-top:18px; border-top:1px dashed var(--dash); padding-top:14px;
    background:none; }
  .barcode i{ display:block; height:22px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 7px, transparent 7px 8px, var(--ink) 8px 9px, transparent 9px 13px); }
  .code{ font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:.3em; color:var(--faint); margin-top:6px; }
</style>

const ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const form = document.getElementById('gate');
const pwEl = document.getElementById('pw');
const errEl = document.getElementById('err');
const goEl = document.getElementById('go');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  goEl.disabled = true; goEl.textContent = 'Unlocking…';
  try {
    const raw = b64(PAYLOAD);
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwEl.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const ptBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(ptBuf);
    const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
    const f = document.createElement('iframe');
    f.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;');
    f.src = url;
    document.title = "Camp August '26 · Run of Show";
    document.body.style.cssText = 'margin:0;padding:0;background:#ffffff;';
    document.body.replaceChildren(f);
  } catch (err) {
    goEl.disabled = false; goEl.textContent = 'Unlock';
    errEl.textContent = 'Wrong password.';
    pwEl.select();
  }
});
</script>
